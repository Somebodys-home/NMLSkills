name: NMLSkills
version: '${version}'

main: io.github.NoOne.nMLSkills.NMLSkills
api-version: '26.3'
load: POSTWORLD
commands:
  skills:
    description: Opens your skills menu
    usage: /<command>
  resetSkills:
    description: Resets your skills
    usage: /<command>
  setSkillLevel:
    description: Sets a skill's level
    usage: /<command> <skill> <level>
  setSkillExp:
    description: Sets a skill's exp
    usage: /<command> <skill> <level>
  maxSkills:
    description: Maxes the level of all the player's skills
    usage: /<command>
  maxExpertiseSkills:
    description: Maxes the level of all the player's expertise skills
    usage: /<command>